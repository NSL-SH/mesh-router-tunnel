# Access log of every server (included into OpenResty's http block via conf.d).
# The backend's gateway-health probe (GatewayHealth.ts) pings /api/ping every few
# seconds, ~17k lines a day: log only the pings that do not answer 2xx.
map "$uri $status" $loggable {
    "~^/api/ping 2"  0;
    default          1;
}

access_log logs/access.log combined if=$loggable;
